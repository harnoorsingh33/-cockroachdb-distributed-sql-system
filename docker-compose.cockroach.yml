version: '3.8'

networks:
  roachnet:
    driver: bridge

services:
  roach1:
    container_name: roach1
    image: cockroachdb/cockroach:v23.2.3
    hostname: roach1
    networks:
      - roachnet
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - roach1_data:/cockroach/cockroach-data
    command: start --insecure --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --advertise-addr=roach1:26257 --http-addr=0.0.0.0:8080 --join=roach1:26257,roach2:26257,roach3:26257 --cache=256MiB --max-sql-memory=256MiB
    restart: unless-stopped

  roach2:
    container_name: roach2
    image: cockroachdb/cockroach:v23.2.3
    hostname: roach2
    networks:
      - roachnet
    ports:
      - "26258:26257"
      - "8081:8080"
    volumes:
      - roach2_data:/cockroach/cockroach-data
    command: start --insecure --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --advertise-addr=roach2:26257 --http-addr=0.0.0.0:8080 --join=roach1:26257,roach2:26257,roach3:26257 --cache=256MiB --max-sql-memory=256MiB
    restart: unless-stopped

  roach3:
    container_name: roach3
    image: cockroachdb/cockroach:v23.2.3
    hostname: roach3
    networks:
      - roachnet
    ports:
      - "26259:26257"
      - "8082:8080"
    volumes:
      - roach3_data:/cockroach/cockroach-data
    command: start --insecure --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --advertise-addr=roach3:26257 --http-addr=0.0.0.0:8080 --join=roach1:26257,roach2:26257,roach3:26257 --cache=256MiB --max-sql-memory=256MiB
    restart: unless-stopped

  roach-init:
    container_name: roach-init
    image: cockroachdb/cockroach:v23.2.3
    networks:
      - roachnet
    depends_on:
      - roach1
      - roach2
      - roach3
    command: init --insecure --host=roach1:26257
    restart: "no"

volumes:
  roach1_data:
  roach2_data:
  roach3_data:
